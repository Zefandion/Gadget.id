<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In (Masuk Akun) - Gadget.Id</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <style>
    .auth-page-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--gray-50);
    }
    .auth-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
    }
    .auth-card {
      background: var(--white);
      border: 1.5px solid var(--gray-200);
      border-radius: 24px;
      width: 100%;
      max-width: 480px;
      padding: 2.8rem 2.2rem;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
      position: relative;
    }
    .auth-brand-logo {
      text-align: center;
      margin-bottom: 1.8rem;
    }
    .auth-brand-logo a {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      color: var(--red);
      text-decoration: none;
      letter-spacing: -1px;
    }
    .auth-brand-logo a span {
      color: var(--black);
    }
    .auth-heading {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-heading h2 {
      font-size: 1.7rem;
      font-weight: 800;
      color: var(--black);
      margin-bottom: 0.4rem;
    }
    .auth-heading p {
      font-size: 0.92rem;
      color: var(--gray-400);
    }
    .input-password-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-password-wrap input {
      padding-right: 45px;
    }
    .pw-toggle-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--gray-400);
      font-size: 1.1rem;
      padding: 4px;
    }
    .form-options-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      font-size: 0.88rem;
    }
    .remember-check {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--gray-600);
      cursor: pointer;
    }
    .remember-check input {
      accent-color: var(--red);
    }
    .forgot-link {
      color: var(--red);
      text-decoration: none;
      font-weight: 600;
    }
    .forgot-link:hover {
      text-decoration: underline;
    }
    .btn-submit-auth {
      width: 100%;
      background: var(--red);
      color: #fff;
      border: none;
      padding: 15px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(224, 26, 26, 0.25);
    }
    .btn-submit-auth:hover {
      background: var(--red-dark);
      transform: translateY(-1px);
    }
    .auth-footer-prompt {
      text-align: center;
      margin-top: 2rem;
      font-size: 0.92rem;
      color: var(--gray-600);
    }
    .auth-footer-prompt a {
      color: var(--red);
      font-weight: 700;
      text-decoration: none;
    }
    .auth-footer-prompt a:hover {
      text-decoration: underline;
    }
    .back-home-link {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      color: var(--gray-400);
      font-size: 0.85rem;
      text-decoration: none;
    }
    .back-home-link:hover {
      color: var(--black);
    }
    @media (max-width: 600px) {
      .auth-main {
        padding: 1.5rem 1rem;
      }
      .auth-card {
        padding: 1.8rem 1.2rem;
        border-radius: 18px;
      }
      .auth-heading h2 {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body class="auth-page-wrapper">

  <!-- NAVBAR -->
  <div id="navbarContainer"></div>

  <main class="auth-main">
    <div class="auth-card">
      <div class="auth-brand-logo">
        <a href="index.html">Gadget<span>.Id</span></a>
      </div>

      <div class="auth-heading">
        <h2>Selamat Datang Kembali</h2>
        <p>Masuk ke akun Gadget.Id Anda untuk melanjutkan transaksi</p>
      </div>

      <form id="loginForm" onsubmit="handleLoginSubmit(event)">
        <div class="form-group">
          <label class="form-label" for="loginEmail">Alamat Email <span>*</span></label>
          <input type="email" id="loginEmail" class="form-input" placeholder="contoh: user@gmail.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="loginPassword">Kata Sandi <span>*</span></label>
          <div class="input-password-wrap">
            <input type="password" id="loginPassword" class="form-input" placeholder="Masukkan kata sandi Anda" required>
            <button type="button" class="pw-toggle-btn" onclick="togglePasswordVisibility('loginPassword', this)">👁️</button>
          </div>
        </div>

        <div class="form-options-row">
          <label class="remember-check">
            <input type="checkbox" id="rememberMe" checked>
            <span>Ingat Saya</span>
          </label>
          <a href="cs.html" class="forgot-link" title="Hubungi CS untuk bantuan reset kata sandi">Lupa Kata Sandi? Hubungi CS</a>
        </div>

        <button type="submit" class="btn-submit-auth" id="btnSubmit">
          Masuk ke Akun Sekarang
        </button>
      </form>

      <div class="auth-footer-prompt">
        Belum memiliki akun? <a href="register.html">Daftar Akun Baru (Sign Up)</a>
      </div>

      <div class="login-cs-banner" style="margin-top:1.6rem;padding:12px 16px;background:#FFF1F2;border:1.5px solid #FECDD3;border-radius:12px;text-align:center;font-size:0.86rem;color:#991B1B;">
        💬 Butuh bantuan atau kendala login? <a href="cs.html" style="color:#E01A1A;font-weight:700;text-decoration:underline;">Hubungi Customer Service 24/7</a>
      </div>

      <a href="home.html" class="back-home-link">← Kembali ke Halaman Utama Toko</a>
    </div>
  </main>

  <!-- FOOTER -->
  <div id="footerContainer"></div>

  <!-- SCRIPTS -->
  <script src="shared.js"></script>
  <script>
    // Auth Protection: If already logged in, redirect to home.html!
    checkAuthProtection('login');

    renderNavbar('login');
    renderFooter();

    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
      } else {
        input.type = 'password';
        btn.textContent = '👁️';
      }
    }

    function handleLoginSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('btnSubmit');

      btn.disabled = true;
      btn.textContent = 'Memverifikasi...';

      setTimeout(() => {
        const result = loginUser(email, password);
        if (result.success) {
          showToast('✅', 'Berhasil masuk! Selamat datang, ' + result.user.name);
          const redirectUrl = sessionStorage.getItem('gadgetid_redirect_after_login') || 'home.html';
          sessionStorage.removeItem('gadgetid_redirect_after_login');
          setTimeout(() => {
            window.location.href = redirectUrl;
          }, 700);
        } else {
          showToast('⚠️', result.message || 'Email atau kata sandi tidak sesuai!');
          btn.disabled = false;
          btn.textContent = 'Masuk ke Akun Sekarang';
        }
      }, 500);
    }
  </script>
</body>
</html>
